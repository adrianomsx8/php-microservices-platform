version: "3.9"

services:

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - gateway-api
      - user-service

  gateway-api:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: gateway-api
    volumes:
      - ./services/gateway-api:/var/www/html
    depends_on:
      - postgres
      - redis
      - rabbitmq

  user-service:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: user-service
    ports:
      - "8001:8000"
    volumes:
      - ./services/user-service:/var/www/html
    depends_on:
      - postgres
      - redis
      - rabbitmq

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"